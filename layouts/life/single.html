{{- define "main" }}

<article class="post-single life-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
        {{ .Date.Format "2006-01-02 15:04" }}
      </time>
      {{- with .Params.location }}
      <span class="life-location"> · 📍 {{ . }}</span>
      {{- end }}
    </div>
  </header>

  {{- if .Params.photos }}
    {{ partial "life/gallery.html" . }}
  {{- end }}

  <div class="post-content life-content">
    {{ .Content }}
  </div>
</article>

{{- end }}
